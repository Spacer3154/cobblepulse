# =====================================================================
#  CobblePulse - Tournois
# =====================================================================

min_participants = 2
max_participants = 512
# Match pour la 3eme place entre les perdants des demi-finales
third_place_match = true
# false : le staff lance chaque ronde (/tournoi nextround) ; true : enchainement automatique
auto_start_rounds = false
round_delay_seconds = 10
countdown_seconds = 5
heal_before_battle = true
# "singles" ou "doubles"
battle_format = "singles"
return_players_after_match = true

# Grade temporaire du vainqueur (LuckPerms)
winner_prefix = "&e[Vainqueur Tournoi] "
winner_prefix_priority = 90
winner_group = ""
# Retrait du grade du precedent vainqueur : "start" (creation du tournoi suivant) ou "end" (fin du suivant)
remove_winner_rank_on = "start"
