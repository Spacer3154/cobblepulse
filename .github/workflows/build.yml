name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: cobblepulse
          MYSQL_DATABASE: cobblepulse
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcobblepulse"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Discover versions & Cobblemon API
        run: python3 ci/discover.py out/discover || true

      - name: Build
        id: build
        run: |
          mkdir -p out
          set +e
          ./gradlew build --stacktrace --no-daemon > out/build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          grep -E "error:|warning: \[removal\]|FAILURE|What went wrong" -A3 out/build.log > out/build-errors.txt || true
          cp build/libs/*.jar out/ 2>/dev/null || true
          exit 0

      - name: Server smoke test
        if: steps.build.outputs.status == '0'
        timeout-minutes: 45
        env:
          CP_MYSQL: '1'
        run: python3 ci/smoke.py out || true

      - name: Publish CI outputs to branch ci-output
        if: always()
        run: |
          cd out
          echo "sha=${GITHUB_SHA} build=${{ steps.build.outputs.status }} run=${GITHUB_RUN_ID}" > STATUS
          git init -q -b ci-output
          git config user.name "cobblepulse-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI output ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-output
